<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B4B5C" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B23A3A" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3B57">Arquitetura do Homelab — Wazuh SIEM</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6B7684">Rede local em modo Bridge (Oracle VirtualBox) — Fase 1 e Fase 2 concluídas</text>

  <!-- Network bridge line -->
  <line x1="70" y1="300" x2="910" y2="300" stroke="#C7CFD6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="490" y="288" text-anchor="middle" font-size="12" fill="#8993A0">rede local — 192.168.1.0/24 (bridge)</text>

  <!-- SIEM Manager box (top center) -->
  <g>
    <rect x="365" y="90" width="250" height="130" rx="10" fill="#EAF1F6" stroke="#2E6E8E" stroke-width="1.5"/>
    <text x="490" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3B57">SIEM Manager</text>
    <text x="490" y="134" text-anchor="middle" font-size="11" fill="#3B4B5C">Ubuntu Server · Wazuh 4.9.2</text>
    <text x="490" y="150" text-anchor="middle" font-size="11" fill="#3B4B5C">Indexer · Server · Dashboard</text>
    <rect x="410" y="162" width="160" height="24" rx="4" fill="#2E6E8E"/>
    <text x="490" y="178" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">IP: 192.168.1.30</text>
    <rect x="410" y="192" width="160" height="20" rx="10" fill="#DCEFE3"/>
    <text x="490" y="206" text-anchor="middle" font-size="10" fill="#1F6B3B" font-weight="600">status: ativo</text>
  </g>

  <!-- Line manager -> bridge -->
  <line x1="490" y1="220" x2="490" y2="300" stroke="#3B4B5C" stroke-width="1.5"/>

  <!-- Windows endpoint box (bottom left) -->
  <g>
    <rect x="40" y="340" width="230" height="150" rx="10" fill="#EAF1F6" stroke="#2E6E8E" stroke-width="1.5"/>
    <text x="155" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3B57">Endpoint Windows</text>
    <text x="155" y="384" text-anchor="middle" font-size="10" fill="#3B4B5C">Windows 11 Home</text>
    <text x="155" y="399" text-anchor="middle" font-size="10" fill="#3B4B5C">Wazuh Agent 4.9.2 — Fase 1</text>
    <rect x="75" y="412" width="160" height="22" rx="4" fill="#2E6E8E"/>
    <text x="155" y="427" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="600">IP: 192.168.1.18</text>
    <rect x="75" y="440" width="160" height="20" rx="10" fill="#DCEFE3"/>
    <text x="155" y="454" text-anchor="middle" font-size="10" fill="#1F6B3B" font-weight="600">status: ativo</text>
  </g>

  <!-- Linux endpoint box (bottom center) -->
  <g>
    <rect x="375" y="340" width="230" height="150" rx="10" fill="#EAF1F6" stroke="#2E6E8E" stroke-width="1.5"/>
    <text x="490" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3B57">Endpoint Linux</text>
    <text x="490" y="384" text-anchor="middle" font-size="10" fill="#3B4B5C">Ubuntu Server + Auditd</text>
    <text x="490" y="399" text-anchor="middle" font-size="10" fill="#3B4B5C">Wazuh Agent 4.7.2 — Fase 2</text>
    <rect x="410" y="412" width="160" height="22" rx="4" fill="#2E6E8E"/>
    <text x="490" y="427" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="600">IP: 192.168.1.21</text>
    <rect x="410" y="440" width="160" height="20" rx="10" fill="#DCEFE3"/>
    <text x="490" y="454" text-anchor="middle" font-size="10" fill="#1F6B3B" font-weight="600">status: ativo</text>
  </g>

  <!-- Kali box (bottom right) -->
  <g>
    <rect x="710" y="340" width="230" height="150" rx="10" fill="#FBEAEA" stroke="#B23A3A" stroke-width="1.5"/>
    <text x="825" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#7A2323">Host de Ataque</text>
    <text x="825" y="384" text-anchor="middle" font-size="10" fill="#8A3A3A">Kali Linux</text>
    <text x="825" y="399" text-anchor="middle" font-size="10" fill="#8A3A3A">hydra · msfvenom — Fase 2</text>
    <rect x="745" y="412" width="160" height="22" rx="4" fill="#B23A3A"/>
    <text x="825" y="427" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="600">IP: 192.168.1.31</text>
    <rect x="745" y="440" width="160" height="20" rx="10" fill="#F6DADA"/>
    <text x="825" y="454" text-anchor="middle" font-size="10" fill="#7A2323" font-weight="600">status: ativo</text>
  </g>

  <!-- Connections down to bridge -->
  <line x1="155" y1="340" x2="155" y2="300" stroke="#3B4B5C" stroke-width="1.5"/>
  <line x1="490" y1="340" x2="490" y2="300" stroke="#3B4B5C" stroke-width="1.5"/>
  <line x1="825" y1="340" x2="825" y2="300" stroke="#B23A3A" stroke-width="1.5"/>

  <!-- Attack flow: Kali -> Linux endpoint -->
  <path d="M 745 415 C 660 355, 590 355, 540 405" fill="none" stroke="#B23A3A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="645" y="345" text-anchor="middle" font-size="10" fill="#B23A3A">SSH brute force (hydra) + payload ELF (msfvenom)</text>

  <!-- Legend -->
  <g>
    <rect x="40" y="230" width="14" height="14" fill="#EAF1F6" stroke="#2E6E8E"/>
    <text x="62" y="242" font-size="11" fill="#3B4B5C">Componente defensivo (SIEM / endpoints monitorados)</text>

    <rect x="40" y="254" width="14" height="14" fill="#FBEAEA" stroke="#B23A3A"/>
    <text x="62" y="266" font-size="11" fill="#7A2323">Host de simulação de ataque (Fase 2)</text>
  </g>
</svg>
