<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B4B5C" />
    </marker>
    <marker id="arrowPlanned" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9AA5AF" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3B57">Arquitetura do Homelab — Wazuh SIEM</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6B7684">Rede local em modo Bridge (Oracle VirtualBox)</text>

  <!-- Network bridge line -->
  <line x1="80" y1="260" x2="820" y2="260" stroke="#C7CFD6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#8993A0">rede local — 192.168.1.0/24 (bridge)</text>

  <!-- SIEM Manager box -->
  <g>
    <rect x="60" y="290" width="230" height="150" rx="10" fill="#EAF1F6" stroke="#2E6E8E" stroke-width="1.5"/>
    <text x="175" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3B57">SIEM Manager</text>
    <text x="175" y="336" text-anchor="middle" font-size="11" fill="#3B4B5C">Ubuntu Server</text>
    <text x="175" y="352" text-anchor="middle" font-size="11" fill="#3B4B5C">Wazuh 4.9.2</text>
    <text x="175" y="368" text-anchor="middle" font-size="11" fill="#3B4B5C">(Indexer · Server · Dashboard)</text>
    <rect x="95" y="382" width="160" height="24" rx="4" fill="#2E6E8E"/>
    <text x="175" y="398" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">IP: 192.168.1.23</text>
    <rect x="95" y="412" width="160" height="20" rx="10" fill="#DCEFE3"/>
    <text x="175" y="426" text-anchor="middle" font-size="10" fill="#1F6B3B" font-weight="600">status: ativo</text>
  </g>

  <!-- Windows endpoint box -->
  <g>
    <rect x="335" y="290" width="230" height="150" rx="10" fill="#EAF1F6" stroke="#2E6E8E" stroke-width="1.5"/>
    <text x="450" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3B57">Endpoint Monitorado</text>
    <text x="450" y="336" text-anchor="middle" font-size="11" fill="#3B4B5C">Windows 11 Home</text>
    <text x="450" y="352" text-anchor="middle" font-size="11" fill="#3B4B5C">Wazuh Agent 4.9.2</text>
    <text x="450" y="368" text-anchor="middle" font-size="11" fill="#3B4B5C">endpoint-01</text>
    <rect x="370" y="382" width="160" height="24" rx="4" fill="#2E6E8E"/>
    <text x="450" y="398" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">IP: 192.168.1.18</text>
    <rect x="370" y="412" width="160" height="20" rx="10" fill="#DCEFE3"/>
    <text x="450" y="426" text-anchor="middle" font-size="10" fill="#1F6B3B" font-weight="600">status: ativo</text>
  </g>

  <!-- Kali box (planned) -->
  <g>
    <rect x="610" y="290" width="230" height="150" rx="10" fill="#F5F5F5" stroke="#9AA5AF" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="725" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5B6570">Host de Ataque</text>
    <text x="725" y="336" text-anchor="middle" font-size="11" fill="#767F89">Kali Linux</text>
    <text x="725" y="352" text-anchor="middle" font-size="11" fill="#767F89">Simulação Fase 2</text>
    <text x="725" y="368" text-anchor="middle" font-size="11" fill="#767F89">(nmap · hydra · msfvenom)</text>
    <rect x="645" y="382" width="160" height="24" rx="4" fill="#9AA5AF"/>
    <text x="725" y="398" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">IP: a definir</text>
    <rect x="645" y="412" width="160" height="20" rx="10" fill="#EDEDED"/>
    <text x="725" y="426" text-anchor="middle" font-size="10" fill="#767F89" font-weight="600">status: planejado</text>
  </g>

  <!-- Connections down to bridge -->
  <line x1="175" y1="290" x2="175" y2="260" stroke="#3B4B5C" stroke-width="1.5"/>
  <line x1="450" y1="290" x2="450" y2="260" stroke="#3B4B5C" stroke-width="1.5"/>
  <line x1="725" y1="290" x2="725" y2="260" stroke="#9AA5AF" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Log flow arrow: endpoint -> manager -->
  <path d="M 335 220 C 280 190, 240 190, 185 218" fill="none" stroke="#3B4B5C" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="260" y="185" text-anchor="middle" font-size="11" fill="#3B4B5C">eventos de segurança (Event ID 4624/4625)</text>

  <!-- Planned attack flow arrow: kali -> endpoint -->
  <path d="M 610 220 C 550 195, 500 195, 452 218" fill="none" stroke="#9AA5AF" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowPlanned)"/>
  <text x="530" y="150" text-anchor="middle" font-size="11" fill="#8993A0">tráfego de ataque simulado (planejado — Fase 2)</text>

  <!-- Legend -->
  <g>
    <rect x="60" y="70" width="14" height="14" fill="#EAF1F6" stroke="#2E6E8E"/>
    <text x="82" y="82" font-size="11" fill="#3B4B5C">Componente ativo (Fase 1 — concluída)</text>

    <rect x="60" y="94" width="14" height="14" fill="#F5F5F5" stroke="#9AA5AF" stroke-dasharray="3 2"/>
    <text x="82" y="106" font-size="11" fill="#767F89">Componente planejado (Fase 2 — em andamento)</text>
  </g>
</svg>
